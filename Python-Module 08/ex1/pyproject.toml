[tool.poetry]
package-mode = false

[project]
name = "matrix-loading"
version = "1.0.0"
description = "The ex1 project"
authors = [
    { name = "yvasques", email = "yann.dias@outlook.com" }
]
requires-python = ">=3.10"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0.0"
numpy = "^1.24.0"
matplotlib = "^3.7.0"

